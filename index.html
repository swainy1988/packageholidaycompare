<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>PackageHolidayCompare - Find Cheap Holidays</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">


<style>

body{
background:#f5f8fb;
}


.search-box{

background:white;
max-width:700px;
margin:40px auto;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #ddd;

}


input,select{

width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;

}


button{

width:100%;
padding:15px;
background:#00a86b;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


.children-age{

display:none;

}


.logo{

font-size:25px;
font-weight:bold;
padding:20px;

}


</style>

</head>



<body>


<header>

<div class="logo">

✈ PackageHolidayCompare

</div>

</header>





<div class="search-box">


<h1>

Find Your Cheapest Holiday

</h1>




<label>

Flying From

</label>


<select id="airport">


<option>
Manchester
</option>

<option>
Liverpool
</option>

<option>
Birmingham
</option>

<option>
London Gatwick
</option>

<option>
London Stansted
</option>


</select>





<label>

Destination

</label>


<select id="destination">


<option value="Egypt">
Egypt
</option>


<option value="Turkey">
Turkey
</option>


<option value="Spain">
Spain
</option>


<option value="Greece">
Greece
</option>


<option value="Cyprus">
Cyprus
</option>


<option value="Portugal">
Portugal
</option>


<option value="Morocco">
Morocco
</option>


</select>





<label>

Adults

</label>


<select id="adults">


<option>
1
</option>

<option selected>
2
</option>

<option>
3
</option>

<option>
4
</option>


</select>





<label>

Children

</label>


<select id="children" onchange="showAges()">



<option value="0">
0
</option>


<option value="1">
1
</option>


<option value="2">
2
</option>


<option value="3">
3
</option>


</select>





<div id="ages" class="children-age">


<label>
Child 1 Age
</label>

<select id="child1">

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
<option>13</option>
<option>14</option>
<option>15</option>

</select>



<label>
Child 2 Age
</label>


<select id="child2">

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
<option>13</option>
<option>14</option>
<option>15</option>

</select>


</div>







<label>

Holiday Length

</label>


<select id="nights">


<option>
7
</option>

<option>
10
</option>

<option>
14
</option>


</select>







<label>

Board Type

</label>


<select id="board">


<option>
All Inclusive
</option>

<option>
Half Board
</option>

<option>
Bed & Breakfast
</option>


</select>








<label>

Maximum Budget

</label>


<select id="budget">


<option value="1000">
£1000
</option>

<option value="1500">
£1500
</option>

<option value="2000">
£2000
</option>

<option value="3000">
£3000
</option>

<option value="5000">
£5000+
</option>


</select>








<button onclick="searchHoliday()">

SEARCH HOLIDAYS

</button>




</div>








<script>


function showAges(){


let children =
document.getElementById("children").value;


let ages =
document.getElementById("ages");


if(children>0){

ages.style.display="block";

}

else{

ages.style.display="none";

}


}






function searchHoliday(){



localStorage.setItem(

"airport",

document.getElementById("airport").value

);



localStorage.setItem(

"destination",

document.getElementById("destination").value

);



localStorage.setItem(

"adults",

document.getElementById("adults").value

);



localStorage.setItem(

"children",

document.getElementById("children").value

);



localStorage.setItem(

"child1",

document.getElementById("child1").value

);



localStorage.setItem(

"child2",

document.getElementById("child2").value

);



localStorage.setItem(

"nights",

document.getElementById("nights").value

);



localStorage.setItem(

"board",

document.getElementById("board").value

);



localStorage.setItem(

"budget",

document.getElementById("budget").value

);





window.location="results.html";


}



</script>


</body>

</html>
