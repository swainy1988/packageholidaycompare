<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Supplier | PackageHolidayCompare</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <!-- Admin Login Protection -->
    <script src="../js/admin-auth.js?v=20260902-1"></script>

</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="logo">
                PackageHolidayCompare
            </div>

            <nav>

                <a href="index.html">
                    📊 Dashboard
                </a>

                <a href="hotels.html">
                    🏨 Hotels
                </a>

                <a href="holiday-offers.html">
                    🌴 Holiday Offers
                </a>

                <a href="images.html">
                    🖼 Images
                </a>

                <a
                    class="active"
                    href="suppliers.html"
                >
                    ✈ Suppliers
                </a>

                <a href="settings.html">
                    ⚙ Settings
                </a>

            </nav>

        </aside>

        <main class="main">

            <header class="topbar">

                <div>

                    <h1>Add Supplier</h1>

                    <p>
                        Add a new holiday supplier.
                    </p>

                </div>

                <a
                    class="btn"
                    href="suppliers.html"
                >
                    ← Back to Suppliers
                </a>

            </header>

            <div class="card">

                <form id="supplierForm">

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="name">
                                Supplier Name *
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Example: Jet2holidays"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="slug">
                                Slug *
                            </label>

                            <input
                                type="text"
                                id="slug"
                                placeholder="example: jet2holidays"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="websiteUrl">
                                Website URL
                            </label>

                            <input
                                type="url"
                                id="websiteUrl"
                                placeholder="https://www.example.com"
                            >

                        </div>

                        <div class="form-group">

                            <label for="logoUrl">
                                Logo URL
                            </label>

                            <input
                                type="url"
                                id="logoUrl"
                                placeholder="https://www.example.com/logo.png"
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label>

                            <input
                                type="checkbox"
                                id="active"
                                checked
                            >

                            Active supplier

                        </label>

                    </div>

                    <div
                        id="formMessage"
                        aria-live="polite"
                    ></div>

                    <div
                        style="
                            display:flex;
                            gap:10px;
                            margin-top:20px;
                        "
                    >

                        <button
                            type="submit"
                            id="saveSupplierButton"
                            class="btn btn-primary"
                        >
                            Save Supplier
                        </button>

                        <a
                            href="suppliers.html"
                            class="btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <script src="../js/add-supplier.js?v=20260902-1"></script>

</body>

</html>
