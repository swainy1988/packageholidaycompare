<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Holiday Offer | PackageHolidayCompare</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="logo">
                PackageHolidayCompare
            </div>

            <nav>

                <a href="index.html">
                    📊 Dashboard
                </a>

                <a href="hotels.html">
                    🏨 Hotels
                </a>

                <a
                    class="active"
                    href="holiday-offers.html"
                >
                    🌴 Holiday Offers
                </a>

                <a href="images.html">
                    🖼 Images
                </a>

                <a href="suppliers.html">
                    ✈ Suppliers
                </a>

                <a href="settings.html">
                    ⚙ Settings
                </a>

            </nav>

        </aside>

        <main class="main">

            <header class="topbar">

                <div>
                    <h1>Edit Holiday Offer</h1>
                    <p>Update an existing supplier offer.</p>
                </div>

                <a
                    class="btn"
                    href="holiday-offers.html"
                >
                    ← Back to Offers
                </a>

            </header>

            <div class="card">

                <form id="offerForm">

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="hotel">
                                Hotel *
                            </label>

                            <select
                                id="hotel"
                                required
                            >
                                <option value="">
                                    Loading hotels...
                                </option>
                            </select>

                        </div>

                        <div class="form-group">

                            <label for="supplier">
                                Supplier *
                            </label>

                            <select
                                id="supplier"
                                required
                            >
                                <option value="">
                                    Loading suppliers...
                                </option>
                            </select>

                        </div>

                        <div class="form-group">

                            <label for="price">
                                Total Price (£) *
                            </label>

                            <input
                                type="number"
                                id="price"
                                min="0.01"
                                step="0.01"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="departure">
                                Departure Date *
                            </label>

                            <input
                                type="date"
                                id="departure"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="airport">
                                Departure Airport *
                            </label>

                            <select
                                id="airport"
                                required
                            >

                                <option value="">
                                    Select airport
                                </option>

                                <option value="Manchester">
                                    Manchester
                                </option>

                                <option value="Liverpool">
                                    Liverpool
                                </option>

                                <option value="Birmingham">
                                    Birmingham
                                </option>

                                <option value="London Gatwick">
                                    London Gatwick
                                </option>

                                <option value="London Heathrow">
                                    London Heathrow
                                </option>

                                <option value="London Luton">
                                    London Luton
                                </option>

                                <option value="London Stansted">
                                    London Stansted
                                </option>

                                <option value="Bristol">
                                    Bristol
                                </option>

                                <option value="East Midlands">
                                    East Midlands
                                </option>

                                <option value="Newcastle">
                                    Newcastle
                                </option>

                                <option value="Glasgow">
                                    Glasgow
                                </option>

                                <option value="Edinburgh">
                                    Edinburgh
                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="nights">
                                Nights *
                            </label>

                            <input
                                type="number"
                                id="nights"
                                min="1"
                                step="1"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="board">
                                Board Basis
                            </label>

                            <select id="board">

                                <option value="">
                                    Select board basis
                                </option>

                                <option value="Room Only">
                                    Room Only
                                </option>

                                <option value="Self Catering">
                                    Self Catering
                                </option>

                                <option value="Bed & Breakfast">
                                    Bed & Breakfast
                                </option>

                                <option value="Half Board">
                                    Half Board
                                </option>

                                <option value="Full Board">
                                    Full Board
                                </option>

                                <option value="All Inclusive">
                                    All Inclusive
                                </option>

                                <option value="Ultra All Inclusive">
                                    Ultra All Inclusive
                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="roomType">
                                Room Type
                            </label>

                            <input
                                type="text"
                                id="roomType"
                                placeholder="Example: Family Room"
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="bookingUrl">
                            Booking URL
                        </label>

                        <input
                            type="url"
                            id="bookingUrl"
                            placeholder="https://www.example.com/holiday"
                        >

                    </div>

                    <div
                        id="formMessage"
                        aria-live="polite"
                    ></div>

                    <div
                        style="
                            display:flex;
                            gap:10px;
                            margin-top:20px;
                        "
                    >

                        <button
                            type="submit"
                            id="saveOfferButton"
                            class="btn btn-primary"
                        >
                            Update Holiday Offer
                        </button>

                        <a
                            href="holiday-offers.html"
                            class="btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <script src="../js/edit-offer.js?v=20260902-2"></script>

</body>

</html>
