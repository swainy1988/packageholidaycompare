<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Holiday Offer | PackageHolidayCompare</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="logo">
                PackageHolidayCompare
            </div>

            <nav>
                <a href="index.html">
                    📊 Dashboard
                </a>

                <a href="hotels.html">
                    🏨 Hotels
                </a>

                <a
                    class="active"
                    href="holiday-offers.html"
                >
                    🌴 Holiday Offers
                </a>

                <a href="images.html">
                    🖼 Images
                </a>

                <a href="suppliers.html">
                    ✈ Suppliers
                </a>

                <a href="settings.html">
                    ⚙ Settings
                </a>
            </nav>

        </aside>

        <main class="main">

            <header class="topbar">

                <div>
                    <h1>Edit Holiday Offer</h1>
                    <p>Update an existing supplier offer.</p>
                </div>

                <a
                    class="btn"
                    href="holiday-offers.html"
                >
                    Back to Offers
                </a>

            </header>

            <div class="card">

                <form id="offerForm">

                    <label for="hotel">
                        Hotel
                    </label>

                    <select
                        id="hotel"
                        required
                    >
                        <option value="">
                            Loading hotels...
                        </option>
                    </select>

                    <label for="supplier">
                        Supplier
                    </label>

                    <select
                        id="supplier"
                        required
                    >
                        <option value="">
                            Select supplier
                        </option>

                        <option value="Jet2holidays">
                            Jet2holidays
                        </option>

                        <option value="TUI">
                            TUI
                        </option>

                        <option value="Loveholidays">
                            Loveholidays
                        </option>

                        <option value="On the Beach">
                            On the Beach
                        </option>

                        <option value="easyJet Holidays">
                            easyJet Holidays
                        </option>

                        <option value="British Airways Holidays">
                            British Airways Holidays
                        </option>

                        <option value="Expedia">
                            Expedia
                        </option>

                        <option value="Booking.com">
                            Booking.com
                        </option>
                    </select>

                    <label for="price">
                        Total Price (£)
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >

                    <label for="departure">
                        Departure Date
                    </label>

                    <input
                        type="date"
                        id="departure"
                        required
                    >

                    <label for="airport">
                        Departure Airport
                    </label>

                    <select
                        id="airport"
                        required
                    >
                        <option value="">
                            Select airport
                        </option>

                        <option value="Manchester">
                            Manchester
                        </option>

                        <option value="Liverpool">
                            Liverpool
                        </option>

                        <option value="Birmingham">
                            Birmingham
                        </option>

                        <option value="London Gatwick">
                            London Gatwick
                        </option>

                        <option value="London Heathrow">
                            London Heathrow
                        </option>

                        <option value="London Luton">
                            London Luton
                        </option>

                        <option value="London Stansted">
                            London Stansted
                        </option>

                        <option value="Bristol">
                            Bristol
                        </option>

                        <option value="East Midlands">
                            East Midlands
                        </option>

                        <option value="Newcastle">
                            Newcastle
                        </option>

                        <option value="Glasgow">
                            Glasgow
                        </option>

                        <option value="Edinburgh">
                            Edinburgh
                        </option>
                    </select>

                    <label for="nights">
                        Nights
                    </label>

                    <input
                        type="number"
                        id="nights"
                        min="1"
                        required
                    >

                    <label for="board">
                        Board Basis
                    </label>

                    <select
                        id="board"
                        required
                    >
                        <option value="All Inclusive">
                            All Inclusive
                        </option>

                        <option value="Ultra All Inclusive">
                            Ultra All Inclusive
                        </option>

                        <option value="Full Board">
                            Full Board
                        </option>

                        <option value="Half Board">
                            Half Board
                        </option>

                        <option value="Bed & Breakfast">
                            Bed & Breakfast
                        </option>

                        <option value="Room Only">
                            Room Only
                        </option>
                    </select>

                    <label for="roomType">
                        Room Type
                    </label>

                    <input
                        type="text"
                        id="roomType"
                        placeholder="Example: Family Room"
                    >

                    <label for="bookingUrl">
                        Booking URL
                    </label>

                    <input
                        type="url"
                        id="bookingUrl"
                        placeholder="https://..."
                    >

                    <button
                        type="submit"
                        id="saveOfferButton"
                        class="btn btn-primary"
                    >
                        Update Holiday Offer
                    </button>

                    <p id="formMessage"></p>

                </form>

            </div>

        </main>

    </div>

    <script src="../js/edit-offer.js"></script>

</body>

</html>
